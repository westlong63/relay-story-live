<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay Story Live</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="css/app.css">
<style>
  body { font-size:17px; }
  main { max-width:640px; margin:0 auto; padding:8px 16px 30px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; color:var(--dim); padding:12px 0; margin-bottom:4px; border-bottom:1px solid var(--line); }
  .top b { font-weight:700; }
  .card { margin:12px 0; padding:18px; }
  h1 { font-size:26px; font-weight:800; margin:18px 0 8px; }
  h2 { font-size:20px; font-weight:800; margin:0 0 10px; }
  main button { width:100%; margin-top:8px; padding:13px 16px; font-size:17px; }
  button.teamBtn { border-left:6px solid var(--c); text-align:left; }
  button.sel { border-color:var(--blue); border-left-color:var(--c); background:var(--tint); box-shadow:inset 0 0 0 1px var(--blue); }
  main input:not([type=checkbox]), main textarea { width:100%; margin-top:6px; }
  textarea { min-height:110px; }
  label { font-size:14px; color:var(--dim); display:block; margin-top:12px; }
  .opt.ok { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:700; }
  .opt.no { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .ep { border-left:3px solid var(--blue); padding-left:12px; margin:14px 0; }
  .ep p { margin:5px 0; line-height:1.55; }
  .big { font-size:40px; font-weight:800; letter-spacing:-0.02em; }
  .rx { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .rx button { font-size:32px; padding:14px 0; }
  .twist { background:var(--tint); border-left:4px solid var(--red); padding:12px 14px; margin-top:8px; }
  .tleft { font-size:30px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums; }
  .tleft.low { color:var(--red); }
  .pledge { display:flex; gap:10px; align-items:flex-start; background:var(--tint); padding:14px; margin-top:14px; font-size:15px; line-height:1.55; }
  .pledge input { width:22px; height:22px; margin-top:2px; flex:none; }
  .sticky { position:sticky; top:0; z-index:3; background:var(--bg); padding:10px 0 6px; border-bottom:1px solid var(--line); }
  .mini { width:auto !important; display:inline-block; padding:8px 12px !important; font-size:14px !important; margin-top:4px !important; }
  .codeIn { font-size:32px; text-align:center; letter-spacing:10px; text-transform:uppercase; font-weight:700; }
  /* 단어 카드 */
  .wemo { font-size:52px; line-height:1.1; margin-top:6px; }
  .syl { font-size:22px; margin:4px 0 6px; color:var(--ink-2); }
  .syl b.st { color:var(--red); font-size:26px; } .syl i { color:var(--line-2); font-style:normal; margin:0 3px; }
  .wko { color:var(--blue); font-weight:800; font-size:22px; }
  .hook { background:#FFF7E0; border-left:4px solid #E0A400; padding:10px 12px; margin:10px 0; font-size:15px; line-height:1.5; }
  .wex { font-size:18px; line-height:1.5; margin:10px 0 2px; } .wex mark { background:linear-gradient(transparent 58%, #FFD6D3 58%); color:inherit; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  /* 단어 게임 */
  .ghead { display:flex; justify-content:space-between; align-items:center; font-weight:700; padding:10px 0 4px; }
  .ghead .sc { color:var(--navy); font-variant-numeric:tabular-nums; } .ghead .cb { color:var(--red); }
  .stage-n { font-size:13px; font-weight:800; letter-spacing:.04em; color:var(--red); }
  .gq { font-size:38px; font-weight:800; margin:8px 0 14px; letter-spacing:-0.02em; text-align:center; }
  .gq.s { font-size:21px; font-weight:600; line-height:1.5; letter-spacing:0; text-align:left; }
  .doors { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .doors button { margin:0 !important; min-height:110px; background:#F7F1E8; border:2px solid #B98B56; border-radius:40px 40px 4px 4px; font-size:19px; font-weight:700; position:relative; }
  .doors button::before { content:attr(data-l); position:absolute; top:10px; left:0; right:0; font-size:12px; color:#9a7448; }
  .doors button::after { content:""; position:absolute; right:16px; top:56%; width:8px; height:8px; border-radius:50%; background:#B98B56; }
  .eggs { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .eggs button { width:auto !important; min-width:92px; height:118px; border-radius:50% 50% 46% 46% / 60% 60% 40% 40%; background:#FFF9EE; border:2px solid #E0C79C; font-size:24px; font-weight:800; margin:0 !important; }
  .opts button { margin-top:8px; }
  button.no { background:var(--bad-bg) !important; border-color:var(--bad) !important; color:var(--bad) !important; animation:shake .3s; }
  button.yes { background:var(--ok-bg) !important; border-color:var(--ok) !important; color:var(--ok) !important; }
  @keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
  .slots { display:flex; gap:6px; justify-content:center; margin:6px 0 16px; flex-wrap:wrap; }
  .slots span { width:38px; height:46px; border-bottom:3px solid var(--navy); font-size:28px; font-weight:800; text-align:center; line-height:46px; color:var(--navy); }
  .tiles { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .tiles button { width:52px !important; height:56px; padding:0 !important; font-size:26px !important; font-weight:800; margin:0 !important; background:#fff; border:2px solid var(--line-2); }
  .tiles button:disabled { opacity:.2; }
  .fb { text-align:center; padding:26px 10px; } .fb .big { color:var(--ok); }
  .rank { font-size:44px; font-weight:800; color:var(--navy); }
  /* 쓰기 도우미 */
  .flow { background:#fff; border:1px solid var(--line); border-top:3px solid var(--blue); padding:12px 14px; margin:12px 0; font-size:15px; }
  .flow b { color:var(--navy); } .flow li { margin:3px 0; }
  .gram { margin-top:6px; font-size:14px; }
  .gram .gi { background:#FFF7E0; border-left:3px solid #E0A400; padding:7px 10px; margin-top:5px; line-height:1.5; }
  .gram .gi code { background:#fff; padding:0 4px; font-family:inherit; font-weight:700; color:var(--bad); }
  .gram .gi button { width:auto; display:inline-block; margin:4px 6px 0 0; padding:5px 10px; font-size:14px; }
  .hintBtn { position:fixed; right:14px; bottom:18px; z-index:20; width:auto !important; padding:12px 16px; font-size:16px; font-weight:800; background:var(--navy); color:#fff; border:0; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:3px solid var(--navy); box-shadow:0 -8px 30px rgba(0,0,0,.2); max-height:58vh; display:flex; flex-direction:column; }
  #sheet[hidden] { display:none; }
  #sheet .tabs { display:flex; border-bottom:1px solid var(--line); }
  #sheet .tabs button { flex:1; border:0; border-radius:0; padding:12px 4px; font-size:15px; background:#fff; margin:0; }
  #sheet .tabs button.on { font-weight:800; color:var(--navy); box-shadow:inset 0 -3px 0 var(--blue); }
  #sheet .body { overflow:auto; padding:10px 14px 16px; max-width:640px; width:100%; margin:0 auto; box-sizing:border-box; }
  #sheet .grp { font-size:13px; font-weight:800; color:var(--red); margin:12px 0 4px; }
  #sheet .ins { display:block; width:100%; text-align:left; margin:5px 0; padding:9px 12px; font-size:16px; background:var(--bar); border:1px solid var(--line); }
  #sheet .ins small { display:block; color:var(--dim); font-size:13px; margin-top:2px; }
  #sheet .ins.w { display:inline-block; width:auto; margin:4px 6px 0 0; }
  #sheet input { width:100%; font-size:17px; padding:10px; }
  #sheet .close { position:absolute; right:8px; top:-46px; width:auto; padding:8px 12px; background:#fff; }
</style>
</head>
<body>
<main id="main">연결 중…</main>
<div id="sheet" hidden></div>
<div class="credit" id="credit"></div>
<script src="js/config.js"></script>
<script>if (window.RSL_CONFIG.firebase && !new URLSearchParams(location.search).has("demo")) document.write('<link rel="preconnect" href="https://identitytoolkit.googleapis.com"><link rel="preconnect" href="' + (window.RSL_CONFIG.firebase.databaseURL || "").replace(/[^\w:/.-]/g, "") + '"><script src="vendor/firebase-app-compat.js"><\/script><script src="vendor/firebase-auth-compat.js"><\/script><script src="vendor/firebase-database-compat.js"><\/script>');</script>
<script src="js/content.js"></script>
<script src="js/engine.js"></script>
<script src="js/bus.js"></script>
<script src="js/grammar.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ITEM_ICON = { bgm: "", voice_cast: "", bonus_scene: "" };
const EMO = { clap: "👏", laugh: "😂", wow: "😮", heart: "❤️" };
const P = RSLBus.params, DEMO = RSLBus.isDemo(), store = RSLBus.store;
const wordRe = RSLEngine.wordRe;
$("#credit").textContent = window.RSL_CONFIG.credit || "";
let link = null, V = null, flash = null, busy = false, endsAt = 0, lastKey = "", hardKey = "", pending = false, autoSent = {};
const room = (P.get("r") || "").toUpperCase().trim();
const JK = `rsl-join-${room}-${P.get("as") || ""}`;

async function boot() {
  if (!room) return askCode();
  try { link = await RSLBus.player(room, P.get("as")); }
  catch (e) {
    if (String(e.message) === "NO_ROOM") return askCode("그런 수업 코드가 없어요. 화면의 코드를 다시 확인해 주세요.");
    $("#main").innerHTML = `<div class="card"><h2>연결하지 못했어요</h2><p>${esc(RSLBus.explain(e))}</p><button onclick="location.reload()">다시 시도</button></div>`; return;
  }
  link.onView(onView);
  setTimeout(() => { if (!V) $("#main").innerHTML = `<h1 class="brk">Relay Story Live</h1><div class="card"><h2>선생님 화면을 기다리는 중이에요</h2>
    <p class="dim">${DEMO ? "시연 모드 주소예요. 시연 모드는 선생님 컴퓨터 안에서만 연결돼요. 선생님 화면의 '수업 모드' QR을 다시 찍어 주세요." : "선생님 화면(전자칠판)이 열려 있는지 확인해 주세요. 열려 있으면 잠시 뒤 자동으로 연결돼요."}</p>
    <button onclick="location.reload()">다시 시도</button></div>`; }, 8000);
  setInterval(tickTimer, 500);
  if (P.get("name") && P.get("team") != null) setTimeout(() => autoJoin(P.get("name"), +P.get("team")), 600);
}
function askCode(msg) {
  $("#main").innerHTML = `<h1 class="brk">Relay Story Live</h1><div class="card"><h2>참여 코드</h2><input id="code" class="codeIn" maxlength="5" placeholder="ABCDE" autocomplete="off">
    <div class="warn">${esc(msg || "")}</div><button class="primary" id="go">들어가기</button></div>`;
  $("#go").onclick = () => { const c = $("#code").value.trim().toUpperCase(); if (c) location.href = `play.html?r=${encodeURIComponent(c)}${DEMO && P.has("demo") ? "&demo=1" : ""}`; };
  $("#code").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
}
async function autoJoin(name, team) { if (V && !V.me) await link.send("join", { name, team }); }

/* ---------- 화면 갱신 ---------- */
function typing() { const a = document.activeElement; return a && ((a.tagName === "INPUT" && a.type !== "checkbox") || a.tagName === "TEXTAREA"); }
/* 주제 번호만 받고, 단어·예문은 이 디벗에 있는 내용에서 꺼내 써요 (보내는 양이 줄어 빨라요) */
function topicOf(t) {
  t = t || {};
  if (t.words) return t;
  const l = window.RSL_CONTENT.topics.find((x) => x.id === t.id);
  return l ? Object.assign({}, l, { characters: Object.keys(l.characters).filter((n) => n !== "Narrator") }) : null;
}
const banned = () => window.RSL_CONTENT.banned.concat((V && V.bannedX) || []);
function onView(v) {
  if (!v) return;
  const T = topicOf(v.topic);
  if (!T) { $("#main").innerHTML = `<div class="card"><h2>화면을 새로고침해 주세요</h2><p class="dim">수업 내용이 새로 바뀌었어요.</p><button onclick="location.reload()">새로고침</button></div>`; return; }
  v.topic = T;
  V = v;
  endsAt = v.write && v.write.endsAt ? v.write.endsAt - (link.offset || 0) : 0;
  const held = v.held || {};
  const hk = [v.phase, v.me ? 1 : 0, v.write && v.write.round, v.write && v.write.done, v.write && v.write.started, held.id, held.submitted, v.quiz, v.wordIndex, v.watching && v.watching.id].join("|");
  const key = JSON.stringify(v, (k, val) => (k === "v" || k === "left" ? undefined : val));
  if (v.write && v.write.closing) autoSave();
  if (hk !== hardKey) { hardKey = hk; lastKey = key; if (typing()) document.activeElement.blur(); render(); return; }
  if (key === lastKey) return;
  lastKey = key;
  if (typing()) { pending = true; return; }
  render();
}
document.addEventListener("focusout", () => setTimeout(() => { if (pending && !typing()) { pending = false; render(); } }, 50));
function tickTimer() {
  const el = $("#tleft"); if (!el || !V || !V.write) return;
  if (V.write.closing) { el.textContent = "저장 중…"; el.classList.add("low"); return; }
  const left = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
  el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; el.classList.toggle("low", left <= 30);
}
function render() {
  if (!V) return;
  if (!V.me) return rJoin();
  const t = V.team;
  const head = `<div class="top"><span>${esc(V.me.name)} · <b style="color:${t.color}">${esc(t.name)}</b></span><span>${esc(V.topic.title)}</span></div>`;
  $("#main").innerHTML = head + ({ topic: rTopic, words: rWords, write: rWrite, video: rVideo, watch: rWatch }[V.phase])();
  bind();
  if (!(V.phase === "write" && V.held && !V.write.done)) hintSheet(false); else if (!$("#sheet").hidden) hintSheet(true);
}

function rJoin() {
  const d = JSON.parse(store.get(JK) || "{}");
  $("#main").innerHTML = `
    <h1 class="brk">Relay Story Live</h1>
    <div class="card"><div class="dim">오늘의 주제</div><h2>${esc(V.topic.title)}</h2>${V.topic.ko ? `<div style="font-weight:700;color:var(--blue)">${esc(V.topic.ko)}</div>` : ""}<div class="dim" style="margin-top:6px">${esc(V.topic.seed)}</div></div>
    <div class="card"><label>닉네임 (실명 말고 별명!)</label><input id="nm" maxlength="12" placeholder="예: Moonlight" value="${esc(d.name || "")}">
    <label>모둠 고르기</label>
    ${V.teams.map((t) => `<button class="teamBtn ${d.team === t.id ? "sel" : ""}" data-team="${t.id}" style="--c:${t.color}">${esc(t.name)} <span class="dim">${t.count}명</span></button>`).join("")}
    <div class="pledge"><input type="checkbox" id="pledge" ${d.pledge ? "checked" : ""}><label for="pledge" style="margin:0;color:var(--ink);font-size:15px"><b>작가 서약</b><br>친구를 존중하고, 반 친구들과 함께 볼 수 있는 이야기를 쓸게요. 친구 실명과 나쁜 말은 쓰지 않을게요.</label></div>
    <button class="primary" id="join">입장하기</button>
    <div id="msg" class="warn"></div></div>`;
  const saveJ = (patch) => store.set(JK, JSON.stringify(Object.assign(JSON.parse(store.get(JK) || "{}"), patch)));
  $("#nm").oninput = () => saveJ({ name: $("#nm").value });
  $("#pledge").onchange = () => saveJ({ pledge: $("#pledge").checked });
  document.querySelectorAll("[data-team]").forEach((b) => b.onclick = () => { saveJ({ team: +b.dataset.team }); document.querySelectorAll("[data-team]").forEach((x) => x.classList.toggle("sel", x === b)); });
  $("#join").onclick = async () => {
    const j = JSON.parse(store.get(JK) || "{}"), name = $("#nm").value.trim();
    if (!name) return ($("#msg").textContent = "닉네임을 써 주세요");
    if (j.team == null) return ($("#msg").textContent = "모둠을 골라 주세요");
    if (!$("#pledge").checked) return ($("#msg").textContent = "작가 서약에 체크해 주세요");
    $("#join").disabled = true; $("#join").textContent = "입장하는 중…";
    const r = await link.send("join", { name, team: j.team });
    if (!r.ok) { $("#join").disabled = false; $("#join").textContent = "입장하기"; $("#msg").textContent = r.msg || "다시 시도해 주세요"; }
    else if (!V.me) $("#join").textContent = "입장했어요! 화면을 불러오는 중…";
  };
}
function rTopic() {
  const T = V.topic;
  return `<div class="card"><div class="dim">오늘의 주제</div><h1>${esc(T.title)}</h1>${T.ko ? `<div style="font-weight:800;color:var(--blue);font-size:19px">${esc(T.ko)}</div>` : ""}
    <p>${esc(T.seed)}</p>${T.seedKo ? `<p class="dim">${esc(T.seedKo)}</p>` : ""}
    <div>등장인물: ${T.characters.map((c) => `<span class="chip">${esc(c)}</span>`).join("")} + 새 인물도 OK</div></div>
    <div class="card"><h2>우리 모둠</h2>${V.team.members.map((m) => `<span class="chip">${esc(m)}</span>`).join("")}
    <p class="dim">곧 오늘의 단어 6개를 배우고, 단어 게임을 한 뒤, 모둠 친구들과 이야기를 돌려 써요. 선생님 화면을 봐 주세요!</p></div>`;
}

/* ---------- 단어 시간: 카드 → 게임 → 복습 ---------- */
const reEsc = (x) => String(x).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const sylHtml = (w) => String(w.syl || w.word).split("-").map((p) => (/[A-Z]/.test(p) ? `<b class="st">${esc(p.toLowerCase())}</b>` : `<span>${esc(p)}</span>`)).join("<i>·</i>");
const hiEx = (w) => esc(w.ex).replace(new RegExp("\\b(" + reEsc(w.word) + "\\w*)", "i"), "<mark>$1</mark>");
function playWord(w, ex) {
  let spoke = false;
  const fb = () => { if (spoke) return; spoke = true; try { const u = new SpeechSynthesisUtterance(ex ? w.ex : w.word); u.lang = "en-US"; u.rate = 0.85; speechSynthesis.speak(u); } catch (e) {} };
  const a = new Audio(`assets/audio/${encodeURIComponent(w.word)}${ex ? "_ex" : ""}.mp3`); a.onerror = fb; a.play().catch(fb);
}
function wordCard(w, i, n) {
  return `<div class="card"><div class="dim">${n ? `단어 ${i + 1}/${n} · ` : ""}${esc(w.pos || "")}</div>
    ${w.emoji ? `<div class="wemo">${esc(w.emoji)}</div>` : ""}<div class="big">${esc(w.word)}</div>
    ${w.syl && w.syl.includes("-") ? `<div class="syl">${sylHtml(w)} <span class="dim" style="font-size:13px">빨간 부분을 세게</span></div>` : ""}
    <div class="wko">${esc(w.ko)}</div>${w.hook ? `<div class="hook">💡 ${esc(w.hook)}</div>` : ""}
    <p class="wex">${hiEx(w)}</p>${w.exKo ? `<p class="dim" style="margin-top:2px">${esc(w.exKo)}</p>` : ""}
    <div class="two"><button data-say="${i}">🔊 단어</button><button data-sayex="${i}">🔊 예문</button></div></div>`;
}
function teamPart() {
  const q = V.team.quiz;
  return `<div class="card"><h2>${esc(V.team.name)} 정답률 ${q.acc}%</h2><div class="bar"><i style="width:${q.acc}%"></i></div>
    <div style="margin-top:8px">${RSLEngine.ITEMS.map((it) => `<span class="chip ${q.items.includes(it.id) ? "on" : ""}">${esc(it.name)} ${Math.round(it.min * 100)}%</span>`).join("")}</div>
    <p class="dim" style="font-size:14px">한 번에 맞힌 비율이 모둠 정답률이에요. 높을수록 우리 영상에 배경음악, 캐릭터별 목소리, 보너스 장면이 생겨요.</p></div>`;
}
const STAGE = { door: ["1단계 · 뜻의 문", "알맞은 뜻이 적힌 문을 열어요"], egg: ["2단계 · 강세 달걀", "세게 읽는 부분의 달걀을 톡!"], listen: ["3단계 · 듣고 고르기", "소리를 듣고 알맞은 단어를 골라요"],

  });

    const T = { words: V.topic.words, seed: V.topic.seed, screens: V.topic.screens || [], characters: Object.fromEntries(["Narrator", ...V.topic.characters].map((c) => [c, {}])) };
    const s = RSLEngine.sample(T, V.write.round, V.me.name.length, !!V.held.choice);
    const d = { title: s.title, screen0: s.scenes[0].screen, text0: s.scenes[0].text, ko0: s.scenes[0].ko || "", pick: s.pick == null ? undefined : s.pick, dirty: true };
    if (s.next && V.write.round + 1 < V.write.rounds) Object.assign(d, { nq: s.next.question, na: s.next.a, nb: s.next.b });
    store.set(dk(), JSON.stringify(d)); render();
  };
  check();
  $("#submit").onclick = async () => {
    const c = collect();
    if (!c.scenes.length) return ($("#msg").textContent = "장면 1의 이야기를 써 주세요");
    if (V.held.choice && c.pick == null) return ($("#msg").textContent = "앞사람이 남긴 갈림길에서 A/B를 골라 주세요");
    $("#submit").disabled = true; const label = $("#submit").textContent; $("#submit").textContent = "보내는 중…";
    const j = await link.send("submit", c);
    if (j.ok) { const d = draft(); d.dirty = false; store.set(dk(), JSON.stringify(d)); $("#msg").textContent = ""; if ($("#submit")) $("#submit").textContent = "✓ 제출했어요"; }
    else { $("#submit").disabled = false; $("#submit").textContent = label; $("#msg").textContent = j.msg || "다시 시도해 주세요"; }
  };
}
/* 라운드 시간이 끝나면 쓰던 내용을 자동으로 제출 */
async function autoSave() {
  if (!V || !V.me || !V.held || !V.write) return;
  const r = V.write.round, d = draft();
  if (autoSent[r] || !d.dirty) return;
  const c = collect(); if (!c.scenes.length) return;
  autoSent[r] = true;
  if (V.held.choice && c.pick == null) c.pick = 0;
  c.auto = true;
  const j = await link.send("submit", c);
  if (j.ok) { d.dirty = false; store.set(dk(), JSON.stringify(d)); }
}
function check() {
  const d = draft(), el = $("#check"); if (!el) return;
  const story = Object.entries(d).filter(([k]) => k.startsWith("text")).map(([, v]) => v).join(" ");
  const all = Object.entries(d).filter(([k]) => /^(text|screen|title|ko|n[qab])/.test(k)).map(([, v]) => v).join("\n");
  document.querySelectorAll("#mission [data-w]").forEach((c) => c.classList.toggle("on", wordRe(c.dataset.w).test(story)));
  const low = all.toLowerCase();
  const bad = banned().filter((w) => (/^[\x00-\x7f]+$/.test(w) ? wordRe(w.toLowerCase()).test(low) : all.includes(w)));
  const used = V.held.mission.filter((w) => wordRe(w).test(story)).length;
  el.innerHTML = `<div>미션 단어 ${used}/${V.held.mission.length} ${used === V.held.mission.length ? "영상에서 금색으로 빛나요!" : ""}</div>` +
    (bad.length ? `<div class="warn">반 친구들과 함께 볼 영상이에요. 이 말은 바꿔 주세요: ${esc(bad.join(", "))}</div>` : `<div class="ok">✔ 함께 보기 좋은 내용이에요</div>`);
}

/* ---------- 쓰기 도우미: 힌트 창 (누르면 마지막으로 쓰던 칸에 들어가요) ---------- */
let lastF = null, lastSel = null, hintTab = "words", hintQ = "";
function trackFields() {
  document.querySelectorAll("[data-f]").forEach((f) => {
    const keep = () => { lastF = f.dataset.f; try { lastSel = [f.selectionStart, f.selectionEnd]; } catch (e) { lastSel = null; } };
    ["focus", "keyup", "click", "input", "blur", "select"].forEach((ev) => f.addEventListener(ev, keep));
  });
}
function toast(t) {
  let el = $("#toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:40;background:var(--navy);color:#fff;padding:9px 14px;font-size:15px;max-width:90vw"; document.body.appendChild(el); }
  el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 1600);
}
function insertText(t) {
  const name = lastF && document.querySelector(`[data-f="${lastF}"]`) ? lastF : "text0";
  const f = document.querySelector(`[data-f="${name}"]`); if (!f) return;
  const v = f.value, [a, b] = lastSel && lastF === name && lastSel[0] != null ? lastSel : [v.length, v.length];
  const pre = v.slice(0, a), post = v.slice(b);
  const multi = f.tagName === "TEXTAREA" && /[.!?:]\s*$/.test(t) && /[.!?]\s*$/.test(pre) && t.length > 18;
  const sepL = !pre ? "" : multi ? "\n" : /\s$/.test(pre) ? "" : " ", sepR = post && !/^[\s.,!?]/.test(post) ? " " : "";
  f.value = pre + sepL + t + sepR + post;
  const at = (pre + sepL).length, blank = t.indexOf("___");
  lastF = name; lastSel = blank >= 0 ? [at + blank, at + blank + 3] : [at + t.length, at + t.length];
  f.dispatchEvent(new Event("input"));
  if (blank >= 0) { hintSheet(false); f.focus(); f.setSelectionRange(lastSel[0], lastSel[1]); toast("___ 자리에 직접 써 넣어요"); }
  else toast("넣었어요: " + t.slice(0, 30));
}
function findWords(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const H = window.RSL_CONTENT.hints, T = V.topic, pool = [];
  T.words.forEach((w) => pool.push([w.word, w.ko])); (T.extra || []).forEach((x) => pool.push(x));
  pool.push(...H.feelings, ...H.places, ...H.dict);
  window.RSL_CONTENT.topics.forEach((t) => { t.words.forEach((w) => pool.push([w.word, w.ko])); (t.extra || []).forEach((x) => pool.push(x)); });
  const seen = new Set(), out = [];
  for (const [e, k] of pool) { const key = e.toLowerCase(); if (seen.has(key) || !(key.startsWith(q) || k.includes(q))) continue; seen.add(key); out.push([e, k]); }
  return out.slice(0, 40);
}
function hintSheet(open) {
  const sh = $("#sheet");
  if (!open || !(V && V.phase === "write" && V.held && !V.write.done)) { sh.hidden = true; return; }
  sh.hidden = false;
  const H = window.RSL_CONTENT.hints, T = V.topic, mis = V.held.mission;
  const ins = (en, ko, cls) => `<button class="ins ${cls || ""}" data-ins="${esc(en)}">${esc(en)}${ko ? `<small>${esc(ko)}</small>` : ""}</button>`;
  const tabs = [["words", "미션 단어"], ["phr", "표현"], ["find", "단어 찾기"], ["scr", "화면 묘사"]];
  let body = "";
  if (hintTab === "words") {
    const mw = T.words.filter((w) => mis.includes(w.word)), ow = T.words.filter((w) => !mis.includes(w.word));
    body = `<div class="grp">이번 라운드 미션 단어 · 누르면 쓰던 칸에 들어가요</div>${mw.map((w) => ins(w.word, `${w.emoji || ""} ${w.ko}`, "w")).join("")}
      <div class="grp">예문을 넣고 조금 바꿔 써 봐요</div>${mw.map((w) => ins(w.ex, w.exKo)).join("")}
      <div class="grp">오늘의 다른 단어</div>${ow.map((w) => ins(w.word, w.ko, "w")).join("")}
      ${T.extra ? `<div class="grp">이 주제에 어울리는 단어</div>${T.extra.map(([e, k]) => ins(e, k, "w")).join("")}` : ""}
      <div class="grp">등장인물 대사 시작</div>${T.characters.map((c) => ins(c + ":", "", "w")).join("")}`;
  }
  if (hintTab === "phr") body = H.phrases.map((g) => `<div class="grp">${esc(g.group)}</div>${g.items.map(([e, k]) => ins(e.trim(), k)).join("")}`).join("") +
    `<div class="grp">기분을 나타내는 말</div>${H.feelings.map(([e, k]) => ins(e, k, "w")).join("")}`;
  if (hintTab === "find") body = `<input id="hq" placeholder="우리말이나 영어로 찾기 (예: 문, 무서운, 달리다)" value="${esc(hintQ)}" autocomplete="off"><div id="hres"></div>`;
  if (hintTab === "scr") body = `<div class="grp">화면 묘사 칸을 먼저 누른 뒤 골라요 · ___ 자리는 직접 채워요</div>${H.screenFrames.map(([e, k]) => ins(e.trim(), k)).join("")}
    <div class="grp">이 주제의 장면 예시</div>${(T.screens || []).map((x) => ins(x)).join("")}
    <div class="grp">장소 (이 말을 쓰면 그림 배경이 바뀌어요)</div>${H.places.map(([e, k]) => ins(e, k, "w")).join("")}`;
  sh.innerHTML = `<button class="close" id="shClose">닫기 ✕</button><div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${hintTab === k ? "on" : ""}">${l}</button>`).join("")}</div><div class="body">${body}</div>`;
  const bindIns = (root) => root.querySelectorAll("[data-ins]").forEach((b) => { b.onmousedown = (e) => e.preventDefault(); b.onclick = () => insertText(b.dataset.ins); });
  bindIns(sh);
  sh.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { hintTab = b.dataset.tab; hintSheet(true); });
  $("#shClose").onclick = () => hintSheet(false);
  const hq = $("#hq");
  if (hq) {
    const show = () => { hintQ = hq.value; const r = findWords(hq.value); $("#hres").innerHTML = hq.value.trim() ? (r.length ? r.map(([e, k]) => ins(e, k, "w")).join("") : `<p class="dim">못 찾았어요. 더 짧게 써 보세요.</p>`) : `<p class="dim">찾고 싶은 말을 우리말로 써 보세요. 영어 단어를 누르면 쓰던 칸에 들어가요.</p>`; bindIns($("#hres")); };
    hq.oninput = show; show();
  }
}

/* ---------- 영어 문장 도우미 ---------- */
let gramT = null; const gramSkip = new Set();
function knownWords() {
  if (knownWords.k === V.topic.id) return knownWords.s;
  const s = new Set(), add = (w) => String(w).toLowerCase().split(/[^a-z]+/).forEach((x) => x && s.add(x));
  for (const t of window.RSL_CONTENT.topics) { t.words.forEach((w) => add(w.word)); (t.extra || []).forEach(([e]) => add(e)); }
  window.RSL_CONTENT.hints.dict.forEach(([e]) => add(e)); V.topic.words.forEach((w) => add(w.word)); V.topic.characters.forEach(add);
  knownWords.s = s; knownWords.k = V.topic.id; return s;
}
function gramAll(now) { clearTimeout(gramT); const run = () => document.querySelectorAll("[data-g]").forEach(gramOne); if (now === true) run(); else gramT = setTimeout(run, 600); }
function gramOne(box) {
  const f = document.querySelector(`[data-f="${box.dataset.g}"]`); if (!f) return;
  const v = f.value;
  const ctx = (x) => { let a = x.s, b = x.e; while (a > 0 && !/\s/.test(v[a - 1])) a--; while (b < v.length && !/\s/.test(v[b])) b++; return [a, b]; };
  const iss = (v.trim() ? RSLGrammar.check(v, { known: knownWords() }) : []).filter((x) => { const [a, b] = ctx(x); return !gramSkip.has(v.slice(a, b) + "|" + x.msg); }).slice(0, 4);
  box.innerHTML = iss.length ? `<div class="dim">✏️ 영어 도우미 · 고쳐 보면 좋은 곳 ${iss.length}개 <span style="font-size:12px">(안 고쳐도 제출돼요)</span></div>` + iss.map((x, n) => {
    const [a, b] = ctx(x), word = v.slice(a, b);
    return `<div class="gi"><code>${esc(word)}</code> ${esc(x.msg)}<br>${x.fixes.map((fx, j) => `<button data-fix="${n}" data-j="${j}">→ ${esc(v.slice(a, x.s) + fx + v.slice(x.e, b))}</button>`).join("")}<button data-skip="${n}" class="ghost">괜찮아요</button></div>`;
  }).join("") : "";
  box.querySelectorAll("[data-fix]").forEach((bt) => { bt.onmousedown = (e) => e.preventDefault(); bt.onclick = () => {
    const x = iss[+bt.dataset.fix]; if (f.value !== v) return gramOne(box);
    f.value = RSLGrammar.apply(v, x, x.fixes[+bt.dataset.j]); f.dispatchEvent(new Event("input")); gramOne(box);
  }; });
  box.querySelectorAll("[data-skip]").forEach((bt) => bt.onclick = () => { const x = iss[+bt.dataset.skip], [a, b] = ctx(x); gramSkip.add(v.slice(a, b) + "|" + x.msg); gramOne(box); });
}
boot();
</script>
