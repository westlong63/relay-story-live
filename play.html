<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay Story Live</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="css/app.css">
<style>
  body { font-size:17px; }
  main { max-width:640px; margin:0 auto; padding:8px 16px 30px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; color:var(--dim); padding:12px 0; margin-bottom:4px; border-bottom:1px solid var(--line); }
  .top b { font-weight:700; }
  .card { margin:12px 0; padding:18px; }
  h1 { font-size:26px; font-weight:800; margin:18px 0 8px; }
  h2 { font-size:20px; font-weight:800; margin:0 0 10px; }
  main button { width:100%; margin-top:8px; padding:13px 16px; font-size:17px; }
  button.teamBtn { border-left:6px solid var(--c); text-align:left; }
  button.sel { border-color:var(--blue); border-left-color:var(--c); background:var(--tint); box-shadow:inset 0 0 0 1px var(--blue); }
  main input:not([type=checkbox]), main textarea { width:100%; margin-top:6px; }
  textarea { min-height:110px; }
  label { font-size:14px; color:var(--dim); display:block; margin-top:12px; }
  .opt.ok { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:700; }
  .opt.no { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .ep { border-left:3px solid var(--blue); padding-left:12px; margin:14px 0; }
  .ep p { margin:5px 0; line-height:1.55; }
  .big { font-size:40px; font-weight:800; letter-spacing:-0.02em; }
  .rx { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .rx button { font-size:32px; padding:14px 0; }
  .twist { background:var(--tint); border-left:4px solid var(--red); padding:12px 14px; margin-top:8px; }
  .tleft { font-size:30px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums; }
  .tleft.low { color:var(--red); }
  .pledge { display:flex; gap:10px; align-items:flex-start; background:var(--tint); padding:14px; margin-top:14px; font-size:15px; line-height:1.55; }
  .pledge input { width:22px; height:22px; margin-top:2px; flex:none; }
  .sticky { position:sticky; top:0; z-index:3; background:var(--bg); padding:10px 0 6px; border-bottom:1px solid var(--line); }
  .mini { width:auto !important; display:inline-block; padding:8px 12px !important; font-size:14px !important; margin-top:4px !important; }
  .codeIn { font-size:32px; text-align:center; letter-spacing:10px; text-transform:uppercase; font-weight:700; }
</style>
</head>
<body>
<main id="main">연결 중…</main>
<div class="credit" id="credit"></div>
<script src="js/config.js"></script>
<script>if (window.RSL_CONFIG.firebase && !new URLSearchParams(location.search).has("demo")) document.write('<script src="vendor/firebase-app-compat.js"><\/script><script src="vendor/firebase-auth-compat.js"><\/script><script src="vendor/firebase-database-compat.js"><\/script>');</script>
<script src="js/content.js"></script>
<script src="js/engine.js"></script>
<script src="js/bus.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ITEM_ICON = { bgm: "", voice_cast: "", bonus_scene: "" };
const EMO = { clap: "👏", laugh: "😂", wow: "😮", heart: "❤️" };
const P = RSLBus.params, DEMO = RSLBus.isDemo(), store = RSLBus.store;
const wordRe = RSLEngine.wordRe;
$("#credit").textContent = window.RSL_CONFIG.credit || "";
let link = null, V = null, flash = null, busy = false, endsAt = 0, lastKey = "", hardKey = "", pending = false, autoSent = {};
const room = (P.get("r") || "").toUpperCase().trim();
const JK = `rsl-join-${room}-${P.get("as") || ""}`;

async function boot() {
  if (!room) return askCode();
  try { link = await RSLBus.player(room, P.get("as")); }
  catch (e) {
    if (String(e.message) === "NO_ROOM") return askCode("그런 수업 코드가 없어요. 화면의 코드를 다시 확인해 주세요.");
    $("#main").innerHTML = `<div class="card"><h2>연결하지 못했어요</h2><p>${esc(RSLBus.explain(e))}</p><button onclick="location.reload()">다시 시도</button></div>`; return;
  }
  link.onView(onView);
  setTimeout(() => { if (!V) $("#main").innerHTML = `<h1 class="brk">Relay Story Live</h1><div class="card"><h2>선생님 화면을 기다리는 중이에요</h2>
    <p class="dim">${DEMO ? "시연 모드 주소예요. 시연 모드는 선생님 컴퓨터 안에서만 연결돼요. 선생님 화면의 '수업 모드' QR을 다시 찍어 주세요." : "선생님 화면(전자칠판)이 열려 있는지 확인해 주세요. 열려 있으면 잠시 뒤 자동으로 연결돼요."}</p>
    <button onclick="location.reload()">다시 시도</button></div>`; }, 8000);
  setInterval(tickTimer, 500);
  if (P.get("name") && P.get("team") != null) setTimeout(() => autoJoin(P.get("name"), +P.get("team")), 600);
}
function askCode(msg) {
  $("#main").innerHTML = `<h1 class="brk">Relay Story Live</h1><div class="card"><h2>참여 코드</h2><input id="code" class="codeIn" maxlength="5" placeholder="ABCDE" autocomplete="off">
    <div class="warn">${esc(msg || "")}</div><button class="primary" id="go">들어가기</button></div>`;
  $("#go").onclick = () => { const c = $("#code").value.trim().toUpperCase(); if (c) location.href = `play.html?r=${encodeURIComponent(c)}${DEMO && P.has("demo") ? "&demo=1" : ""}`; };
  $("#code").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
}
async function autoJoin(name, team) { if (V && !V.me) await link.send("join", { name, team }); }

/* ---------- 화면 갱신 ---------- */
function typing() { const a = document.activeElement; return a && ((a.tagName === "INPUT" && a.type !== "checkbox") || a.tagName === "TEXTAREA"); }
function onView(v) {
  if (!v) return;
  V = v;
  endsAt = v.write && v.write.endsAt ? v.write.endsAt - (link.offset || 0) : 0;
  const held = v.held || {};
  const hk = [v.phase, v.me ? 1 : 0, v.write && v.write.round, v.write && v.write.done, v.write && v.write.started, held.id, held.submitted, v.quiz, v.wordIndex, v.watching && v.watching.id].join("|");
  const key = JSON.stringify(v, (k, val) => (k === "v" || k === "left" ? undefined : val));
  if (v.write && v.write.closing) autoSave();
  if (hk !== hardKey) { hardKey = hk; lastKey = key; if (typing()) document.activeElement.blur(); render(); return; }
  if (key === lastKey) return;
  lastKey = key;
  if (typing()) { pending = true; return; }
  render();
}
document.addEventListener("focusout", () => setTimeout(() => { if (pending && !typing()) { pending = false; render(); } }, 50));
function tickTimer() {
  const el = $("#tleft"); if (!el || !V || !V.write) return;
  if (V.write.closing) { el.textContent = "저장 중…"; el.classList.add("low"); return; }
  const left = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
  el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; el.classList.toggle("low", left <= 30);
}
function render() {
  if (!V) return;
  if (!V.me) return rJoin();
  const t = V.team;
  const head = `<div class="top"><span>${esc(V.me.name)} · <b style="color:${t.color}">${esc(t.name)}</b></span><span>${esc(V.topic.title)}</span></div>`;
  $("#main").innerHTML = head + ({ topic: rTopic, words: rWords, write: rWrite, video: rVideo, watch: rWatch }[V.phase])();
  bind();
}

function rJoin() {
  const d = JSON.parse(store.get(JK) || "{}");
  $("#main").innerHTML = `
    <h1 class="brk">Relay Story Live</h1>
    <div class="card"><div class="dim">TODAY'S TOPIC</div><h2>${esc(V.topic.title)}</h2><div class="dim">${esc(V.topic.seed)}</div></div>
    <div class="card"><label>닉네임 (실명 말고 별명!)</label><input id="nm" maxlength="12" placeholder="예: Moonlight" value="${esc(d.name || "")}">
    <label>모둠 고르기</label>
    ${V.teams.map((t) => `<button class="teamBtn ${d.team === t.id ? "sel" : ""}" data-team="${t.id}" style="--c:${t.color}">${esc(t.name)} <span class="dim">${t.count}명</span></button>`).join("")}
    <div class="pledge"><input type="checkbox" id="pledge" ${d.pledge ? "checked" : ""}><label for="pledge" style="margin:0;color:var(--ink);font-size:15px"><b>작가 서약</b><br>친구를 존중하고, 반 친구들과 함께 볼 수 있는 이야기를 쓸게요. 친구 실명과 나쁜 말은 쓰지 않을게요.</label></div>
    <button class="primary" id="join">입장하기</button>
    <div id="msg" class="warn"></div></div>`;
  const saveJ = (patch) => store.set(JK, JSON.stringify(Object.assign(JSON.parse(store.get(JK) || "{}"), patch)));
  $("#nm").oninput = () => saveJ({ name: $("#nm").value });
  $("#pledge").onchange = () => saveJ({ pledge: $("#pledge").checked });
  document.querySelectorAll("[data-team]").forEach((b) => b.onclick = () => { saveJ({ team: +b.dataset.team }); document.querySelectorAll("[data-team]").forEach((x) => x.classList.toggle("sel", x === b)); });
  $("#join").onclick = async () => {
    const j = JSON.parse(store.get(JK) || "{}"), name = $("#nm").value.trim();
    if (!name) return ($("#msg").textContent = "닉네임을 써 주세요");
    if (j.team == null) return ($("#msg").textContent = "모둠을 골라 주세요");
    if (!$("#pledge").checked) return ($("#msg").textContent = "작가 서약에 체크해 주세요");
    $("#join").disabled = true;
    const r = await link.send("join", { name, team: j.team });
    if (!r.ok) { $("#join").disabled = false; $("#msg").textContent = r.msg || "다시 시도해 주세요"; }
  };
}
function rTopic() {
  return `<div class="card"><div class="dim">TODAY'S TOPIC</div><h1>${esc(V.topic.title)}</h1><p>${esc(V.topic.seed)}</p>
    <div>등장인물: ${V.topic.characters.map((c) => `<span class="chip">${esc(c)}</span>`).join("")} + 새 인물도 OK</div></div>
    <div class="card"><h2>우리 모둠</h2>${V.team.members.map((m) => `<span class="chip">${esc(m)}</span>`).join("")}
    <p class="dim">곧 단어를 배우고, 모둠 친구들과 이야기를 돌려 쓸 거예요. 선생님 화면을 봐 주세요!</p></div>`;
}
function rWords() {
  const w = V.topic.words[V.wordIndex];
  const card = `<div class="card"><div class="dim">WORD ${V.wordIndex + 1}/${V.topic.words.length}</div><div class="big">${esc(w.word)}</div>
    <div style="color:var(--gold);font-weight:800">${esc(w.ko)}</div><p>${esc(w.ex)}</p><button id="say">🔊 듣기</button></div>`;
  const teamPart = `<div class="card"><h2>${esc(V.team.name)} 정답률 ${V.team.quiz.acc}%</h2><div class="bar"><i style="width:${V.team.quiz.acc}%"></i></div>
    <div style="margin-top:8px">${V.items.map((it) => `<span class="chip ${V.team.quiz.items.includes(it.id) ? "on" : ""}">${ITEM_ICON[it.id]} ${esc(it.name)} ${Math.round(it.min * 100)}%</span>`).join("")}</div>
    <p class="dim" style="font-size:14px">모둠 정답률이 높을수록 우리 영상에 배경음악, 캐릭터별 목소리, 보너스 장면이 생겨요.</p></div>`;
  if (V.quiz === "closed") return card + `<div class="card dim">곧 단어 퀴즈가 시작돼요. 모둠 정답률이 높으면 영상 아이템을 받아요! </div>`;
  const qs = V.questions || [], next = qs.find((q) => q.picked == null);
  const right = qs.filter((q) => q.ok).length, done = qs.filter((q) => q.picked != null).length;
  if (flash) return `<div class="card" style="text-align:center"><div class="big">${flash.ok ? "⭕" : "❌"}</div>${flash.ok ? "정답!" : "정답: <b>" + esc(flash.answer) + "</b>"}</div>` + teamPart;
  if (V.quiz === "open" && next) {
    return `<div class="card"><div class="dim">QUIZ ${done + 1}/${qs.length} · ${next.kind === "meaning" ? "뜻 고르기" : "빈칸 채우기"}</div>
      <h2 style="font-size:${next.kind === "meaning" ? 34 : 21}px">${esc(next.prompt)}</h2>
      ${next.options.map((o) => `<button class="opt" data-opt="${esc(o)}" data-q="${next.id}">${esc(o)}</button>`).join("")}</div>` + teamPart;
  }
  return `<div class="card"><h2>내 점수 ${right} / ${qs.length}</h2>${qs.map((q) => `<div class="${q.ok ? "ok" : "warn"}">${q.ok ? "⭕" : "❌"} ${esc(q.prompt)} → ${esc(q.answer || "")}</div>`).join("")}</div>` + teamPart;
}
function epHtml(e, i) {
  return `<div class="ep"><b>EP${i + 1} ${esc(e.title || "")}</b> <span class="dim">by ${esc(e.writer)}</span>
    ${e.scenes.map((s) => `${s.screen ? `<p class="dim">${esc(s.screen)}</p>` : ""}<p>${esc(s.text).replace(/\n/g, "<br>")}</p>`).join("")}
    ${e.next ? `<p class="dim">❓ ${esc(e.next.question)} (A) ${esc(e.next.a)} / (B) ${esc(e.next.b)}</p>` : ""}</div>`;
}
const dk = () => `rsl-draft-${room}-${V.me.id}-${V.write.round}`;
const draft = () => { try { return JSON.parse(store.get(dk()) || "{}"); } catch (e) { return {}; } };
function rWrite() {
  const w = V.write, h = V.held;
  if (!w.started) return `<div class="card"><h2>곧 돌려 쓰기를 시작해요</h2><p class="dim">선생님이 시작하면 내 이야기의 1화를 쓰게 돼요.</p></div>`;
  if (w.done) return `<div class="card"><h2>돌려 쓰기 끝!</h2><p class="dim">이제 모둠 이야기들이 영상으로 만들어져요. 선생님 화면을 봐 주세요.</p></div>` +
    (V.teamStories || []).map((s) => `<div class="card"><h2>${esc(s.title || s.starter + "의 이야기")}</h2>${s.episodes.map(epHtml).join("")}</div>`).join("");
  if (!h) return `<div class="card"><h2>이번 돌려 쓰기는 이미 시작됐어요</h2><p class="dim">다음 활동부터 함께 써요. 지금은 친구들 이야기를 응원해 주세요!</p></div>`;
  const prog = (V.teamProgress || []).map((x) => `<span class="chip ${x.done ? "on" : ""}">${x.done ? "✓" : "✏️"} ${esc(x.name)}</span>`).join("");
  const d = draft(), last = h.episodes[h.episodes.length - 1], k = h.episodes.length;
  const scenes = Array.from({ length: V.maxScenes }, (_, i) => `
    <div class="card"><h2>장면 ${i + 1}${i >= 2 ? " 보너스" : ""}${i > 0 ? ' <span class="dim" style="font-size:14px">(선택)</span>' : ""}</h2>
      <label>화면 묘사 · 영어 한 줄 (이게 그림이 돼요: 누가, 어디서)</label>
      <input data-f="screen${i}" value="${esc(d["screen" + i] || "")}" placeholder="Mina and Jun stand on the dark rooftop.">
      <label>이야기 · 대사는 <b>Mina: Hello!</b> 처럼 '이름:'으로 시작</label>
      <textarea data-f="text${i}" placeholder="Suddenly, the door opened.&#10;Jun: What is that?">${esc(d["text" + i] || "")}</textarea>
    </div>`).join("");
  return `
    <div class="sticky"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>ROUND ${w.round + 1}/${w.rounds}</b> · ${h.mineStarted ? "내가 시작한 이야기" : `${esc(h.starter)}의 이야기 ${k + 1}화`}</div><div class="tleft" id="tleft"></div></div>
      <div>미션: <span id="mission">${h.mission.map((m) => `<span class="chip" data-w="${esc(m)}">${esc(m)}</span>`).join("")}</span></div></div>
    ${h.submitted ? `<div class="card" style="border:2px solid var(--ok)"><b class="ok">✓ 제출했어요!</b> <span class="dim">시간이 남았으면 고쳐서 다시 제출해도 돼요.</span><div style="margin-top:6px">${prog}</div></div>` : ""}
    ${k ? `<div class="card"><h2>지금까지의 이야기 (${k}화)</h2>${h.episodes.length > 1 ? `<details><summary class="dim">앞부분 보기</summary>${h.episodes.slice(0, -1).map(epHtml).join("")}</details>` : ""}${epHtml(last, k - 1)}</div>` :
      `<div class="card"><h2>내 이야기의 1화를 시작해요</h2><p class="dim">${esc(V.topic.seed)}</p><p class="dim">이 이야기는 다음 라운드에 옆 친구가 이어 써요.</p></div>`}
    ${h.twist ? `<div class="twist"><b>Twist 카드</b> (넣으면 더 재밌어요): ${esc(h.twist)}</div>` : ""}
    ${h.choice ? `<div class="twist">❓ 앞사람이 남긴 갈림길: <b>${esc(h.choice.question)}</b>
        <button data-pick="0" class="${d.pick === 0 ? "sel" : ""}">A) ${esc(h.choice.a)}</button><button data-pick="1" class="${d.pick === 1 ? "sel" : ""}">B) ${esc(h.choice.b)}</button></div>` : ""}
    <div class="card"><label>이번 화 제목 (선택)</label><input data-f="title" value="${esc(d.title || "")}" placeholder="${k ? "The Secret Door" : "A Strange Night"}"></div>
    ${scenes}
    ${w.round + 1 < w.rounds ? `<div class="card"><h2>다음 사람에게 갈림길 남기기 <span class="dim" style="font-size:14px">(선택)</span></h2>
      <input data-f="nq" value="${esc(d.nq || "")}" placeholder="What should Jun do?">
      <input data-f="na" value="${esc(d.na || "")}" placeholder="A) Open the door">
      <input data-f="nb" value="${esc(d.nb || "")}" placeholder="B) Call for help"></div>` : `<div class="card dim">마지막 라운드예요. 이야기를 멋지게 끝내 주세요!</div>`}
    <div id="check" class="card"></div>
    ${DEMO ? `<button id="sample" class="ghost">(시연용) 예시로 채우기</button>` : ""}
    <button class="primary" id="submit">${h.submitted ? "고친 내용 다시 제출 ✓" : "다 썼어요! 제출 ✓"}</button>
    <div id="msg" class="warn"></div>
    ${h.submitted ? "" : `<div class="card"><div class="dim">우리 모둠 진행</div>${prog}</div>`}`;
}
function rVideo() {
  const list = V.teamStories || [];
  return `<div class="card"><h2>우리 모둠 대표작 고르기</h2><p class="dim">다 같이 볼 영상 1편을 골라요. 표가 가장 많은 이야기가 대표작(★)이 돼요. 나머지도 나중에 우리 반 영상관에서 볼 수 있어요.</p></div>
    ${list.map((s) => `<div class="card" style="${V.myVote === s.id ? "outline:3px solid var(--gold)" : ""}"><h2>${V.rep === s.id ? "★ " : ""}${esc(s.title || s.starter + "의 이야기")}</h2>
      <div class="dim">by ${esc([...new Set(s.writers)].join(", "))} · 단어 ${s.used}/${s.total} · ${s.votes}표</div>
      <details><summary class="dim">이야기 읽기</summary>${s.episodes.map(epHtml).join("")}</details>
      <button data-tv="${s.id}" class="${V.myVote === s.id ? "primary" : ""}">${V.myVote === s.id ? "✔ 내가 고른 대표작" : "이 이야기에 투표"}</button></div>`).join("") || '<div class="card dim">아직 이야기가 없어요</div>'}`;
}
function rWatch() {
  const w = V.watching, others = (V.screenTeams || []).filter((t) => t.id !== V.me.team);
  const gal = `watch.html?r=${encodeURIComponent(room)}${DEMO ? "&demo=1" : ""}`;
  return `<div class="card">${w ? `<div class="dim">지금 상영 중</div><h2 style="color:${w.color}">${esc(w.name)} · ${esc(w.title)}</h2>
      <div class="rx">${Object.keys(EMO).map((e) => `<button data-rx="${e}">${EMO[e]}</button>`).join("")}</div><p class="dim" style="font-size:14px">누르면 큰 화면에 이모지가 떠올라요</p>` : "<h2>시상식!</h2>"}</div>
    <div class="card"><h2>Best Story 투표 (우리 모둠 말고)</h2>
      ${others.map((t) => `<button class="teamBtn ${V.voted === t.id ? "sel" : ""}" data-vote="${t.id}" style="--c:${t.color}">${esc(t.name)} ${V.voted === t.id ? "✔" : ""}</button>`).join("")}
      <p class="dim">영상을 다 본 뒤에 바꿔도 돼요.</p></div>
    <div class="card"><h2>우리 반 영상관</h2><p class="dim">수업이 끝나도 모든 이야기 영상을 다시 볼 수 있어요.${V.myStory ? " 내가 시작한 이야기도 있어요!" : ""}</p>
      <a href="${gal}${V.myStory ? "&s=" + V.myStory : ""}" target="_blank"><button>영상관 열기 ↗</button></a></div>`;
}

/* ---------- 버튼 ---------- */
function bind() {
  if ($("#say")) $("#say").onclick = () => { const w = V.topic.words[V.wordIndex]; let spoke = false; const fb = () => { if (spoke) return; spoke = true; try { const u = new SpeechSynthesisUtterance(w.word); u.lang = "en-US"; u.rate = 0.85; speechSynthesis.speak(u); } catch (e) {} }; const a = new Audio(`assets/audio/${encodeURIComponent(w.word)}.mp3`); a.onerror = fb; a.play().catch(fb); };
  document.querySelectorAll("[data-opt]").forEach((b) => b.onclick = async () => {
    if (busy) return; busy = true;
    const j = await link.send("answer", { qid: b.dataset.q, choice: b.dataset.opt });
    busy = false;
    if (j.ok) { flash = { ok: j.correct, answer: j.answer }; render(); setTimeout(() => { flash = null; render(); }, 1100); }
  });
  document.querySelectorAll("[data-rx]").forEach((b) => b.onclick = () => { if (V.watching) link.send("react", { team: V.watching.id, emoji: b.dataset.rx }); b.animate([{ transform: "scale(1.35)" }, { transform: "scale(1)" }], 250); });
  document.querySelectorAll("[data-vote]").forEach((b) => b.onclick = () => link.send("vote", { team: +b.dataset.vote }));
  document.querySelectorAll("[data-tv]").forEach((b) => b.onclick = () => link.send("teamVote", { story: b.dataset.tv }));
  if (V.phase === "write" && V.held && !V.write.done) bindWrite();
}
function collect() {
  const d = draft(), scenes = Array.from({ length: V.maxScenes }, (_, i) => ({ screen: d["screen" + i] || "", text: d["text" + i] || "" })).filter((s) => s.text.trim());
  return { title: d.title || "", scenes, pick: d.pick, round: V.write.round,
    next: d.nq && d.na && d.nb ? { question: d.nq, a: String(d.na).replace(/^A\)\s*/i, ""), b: String(d.nb).replace(/^B\)\s*/i, "") } : null };
}
function bindWrite() {
  const fields = document.querySelectorAll("[data-f]");
  const save = () => { const d = draft(); fields.forEach((f) => (d[f.dataset.f] = f.value)); d.dirty = true; store.set(dk(), JSON.stringify(d)); check(); };
  fields.forEach((f) => (f.oninput = save));
  document.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => {
    const d = draft(); d.pick = +b.dataset.pick; d.dirty = true; store.set(dk(), JSON.stringify(d));
    document.querySelectorAll("[data-pick]").forEach((x) => x.classList.toggle("sel", x === b));
  });
  if ($("#sample")) $("#sample").onclick = () => {
    const T = { words: V.topic.words, seed: V.topic.seed, screens: V.topic.screens || [], characters: Object.fromEntries(["Narrator", ...V.topic.characters].map((c) => [c, {}])) };
    const s = RSLEngine.sample(T, V.write.round, V.me.name.length, !!V.held.choice);
    const d = { title: s.title, screen0: s.scenes[0].screen, text0: s.scenes[0].text, pick: s.pick == null ? undefined : s.pick, dirty: true };
    if (s.next && V.write.round + 1 < V.write.rounds) Object.assign(d, { nq: s.next.question, na: s.next.a, nb: s.next.b });
    store.set(dk(), JSON.stringify(d)); render();
  };
  check();
  $("#submit").onclick = async () => {
    const c = collect();
    if (!c.scenes.length) return ($("#msg").textContent = "장면 1의 이야기를 써 주세요");
    if (V.held.choice && c.pick == null) return ($("#msg").textContent = "앞사람이 남긴 갈림길에서 A/B를 골라 주세요");
    $("#submit").disabled = true;
    const j = await link.send("submit", c);
    if (j.ok) { const d = draft(); d.dirty = false; store.set(dk(), JSON.stringify(d)); $("#msg").textContent = ""; }
    else { $("#submit").disabled = false; $("#msg").textContent = j.msg || "다시 시도해 주세요"; }
  };
}
/* 라운드 시간이 끝나면 쓰던 내용을 자동으로 제출 */
async function autoSave() {
  if (!V || !V.me || !V.held || !V.write) return;
  const r = V.write.round, d = draft();
  if (autoSent[r] || !d.dirty) return;
  const c = collect(); if (!c.scenes.length) return;
  autoSent[r] = true;
  if (V.held.choice && c.pick == null) c.pick = 0;
  c.auto = true;
  const j = await link.send("submit", c);
  if (j.ok) { d.dirty = false; store.set(dk(), JSON.stringify(d)); }
}
function check() {
  const d = draft(), el = $("#check"); if (!el) return;
  const story = Object.entries(d).filter(([k]) => k.startsWith("text")).map(([, v]) => v).join(" ");
  const all = Object.entries(d).filter(([k]) => /^(text|screen|title|n[qab])/.test(k)).map(([, v]) => v).join("\n");
  document.querySelectorAll("#mission [data-w]").forEach((c) => c.classList.toggle("on", wordRe(c.dataset.w).test(story)));
  const low = all.toLowerCase();
  const bad = (V.banned || []).filter((w) => (/^[\x00-\x7f]+$/.test(w) ? wordRe(w.toLowerCase()).test(low) : all.includes(w)));
  const used = V.held.mission.filter((w) => wordRe(w).test(story)).length;
  el.innerHTML = `<div>미션 단어 ${used}/${V.held.mission.length} ${used === V.held.mission.length ? "영상에서 금색으로 빛나요!" : ""}</div>` +
    (bad.length ? `<div class="warn">반 친구들과 함께 볼 영상이에요. 이 말은 바꿔 주세요: ${esc(bad.join(", "))}</div>` : `<div class="ok">✔ 함께 보기 좋은 내용이에요</div>`);
}
boot();
</script>
