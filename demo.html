<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Story Live · 시연 모드</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="css/app.css">
<style>
  html, body { height:100%; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  /* 주의: app.css의 .bar(진행 막대, 높이 14px)와 겹치지 않게 .topbar를 써요 */
  .topbar { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--glass); color:#dfe9fb; font-size:15px; flex-wrap:wrap; flex:none; box-shadow:0 8px 24px rgba(8,24,70,.25); }
  .topbar b { font-weight:800; color:#fff; }
  .topbar .tag { margin-right:2px; }
  .topbar .act { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; font-size:16px; font-weight:700; text-decoration:none; border-radius:4px; color:#1d4fc0; background:linear-gradient(#ffffff, #e9f1ff); box-shadow:inset 0 2px 0 #fff, 0 0 0 2px #9dbbe9, 0 3px 0 2px #7d9ed6; cursor:pointer; font-family:var(--px-font); }
  .topbar .act.home { color:#fff; background:linear-gradient(#5d9cff, #2f6fe8 55%, #2459cc); box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 0 0 2px #163f9e, 0 3px 0 2px #0f2c73; }
  .topbar .act:hover { filter:brightness(1.08); }
  .wrap { flex:1; display:flex; gap:12px; padding:12px; min-height:0; }
  .host { flex:1; min-width:0; position:relative; overflow:hidden; background:#fff; border-radius:8px; box-shadow:0 0 0 3px #0f2c73, 0 14px 30px rgba(8,30,90,.3); }
  .phones { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:12px; width:min(44vw, 640px); }
  .phone { position:relative; overflow:hidden; background:#fff; border:6px solid #14306e; border-radius:18px; box-shadow:0 10px 24px rgba(8,30,90,.3); }
  .phone .lab { position:absolute; bottom:6px; right:8px; z-index:2; font-size:12px; color:#fff; background:var(--glass); padding:2px 8px; border-radius:3px; }
  iframe { border:0; position:absolute; top:0; left:0; transform-origin:0 0; background:var(--bg); }
  .credit { padding:6px; font-size:12px; }
</style>
</head>
<body>
<div class="topbar"><a class="act home" href="index.html">← 첫 화면으로</a><span class="tag">DEMO</span><b>시연 모드</b> 이 컴퓨터 안에서만 연결돼요. 왼쪽이 전자칠판(교사) 화면, 오른쪽이 학생 디벗 4대예요.
  <span class="dim">왼쪽 아래 버튼으로 가상 학생을 더 넣을 수 있어요.</span><span style="flex:1"></span>
  <button class="act" id="again">↻ 처음부터 다시</button></div>
<div class="wrap">
  <div class="host" id="hostBox"><iframe id="hostF" data-w="1600" data-h="980" allow="fullscreen; autoplay"></iframe></div>
  <div class="phones" id="phones"></div>
</div>
<div class="credit" id="credit"></div>
<script src="js/config.js"></script>
<script src="js/bus.js"></script>
<script>
  document.getElementById("credit").textContent = (window.RSL_CONFIG || {}).credit || "";
  const room = "D" + RSLBus.newCode().slice(0, 4);
  const kids = [["Moonlight", 0], ["Pancake", 0], ["Blue Whale", 1], ["Sunny", 1]];
  document.getElementById("hostF").src = `host.html?demo=1&r=${room}`;
  const ph = document.getElementById("phones");
  kids.forEach(([n, t], i) => {
    const d = document.createElement("div"); d.className = "phone";
    d.innerHTML = `<span class="lab">학생 디벗 ${i + 1} · ${n}</span><iframe data-w="420" data-h="820" src="play.html?demo=1&r=${room}&as=${i + 1}&name=${encodeURIComponent(n)}&team=${t}"></iframe>`;
    ph.appendChild(d);
  });
  function fit() {
    document.querySelectorAll("iframe").forEach((f) => {
      const box = f.parentElement, w = +f.dataset.w, h = +f.dataset.h;
      const s = Math.min(box.clientWidth / w, box.clientHeight / h);
      const sw = box.clientWidth / s, sh = box.clientHeight / s;
      f.style.width = sw + "px"; f.style.height = sh + "px"; f.style.transform = `scale(${s})`;
    });
  }
  addEventListener("resize", fit); fit(); setTimeout(fit, 300);
  document.getElementById("again").onclick = () => location.reload();
</script>
</body>
</html>
