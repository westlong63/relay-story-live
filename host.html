<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Story Live · 교사 화면</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="css/app.css">
<style>
  header { display:flex; align-items:stretch; gap:6px; padding:0 28px; height:76px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; letter-spacing:-0.02em; margin-right:22px; white-space:nowrap; }
  header .brand::before { content:""; width:14px; height:14px; border-top:3px solid var(--red); border-right:3px solid var(--red); }
  .step { background:transparent; border:0; border-radius:0; color:var(--ink); padding:0 16px; font-size:19px; font-weight:500; position:relative; white-space:nowrap; }
  .step::after { content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:3px; background:transparent; }
  .step:hover:not(:disabled) { color:var(--blue); }
  .step.on { font-weight:800; color:var(--navy); }
  .step.on::after { background:var(--blue-2); }
  .step .n { font-size:13px; font-weight:600; color:var(--light); margin-right:6px; font-variant-numeric:tabular-nums; }
  .step.on .n { color:var(--red); }
  header .sp { flex:1; }
  header .meta { display:flex; align-items:center; gap:10px; white-space:nowrap; }
  .code { font-weight:800; letter-spacing:4px; background:var(--navy); color:#fff; padding:7px 12px 7px 16px; font-variant-numeric:tabular-nums; }
  body { padding-bottom:110px; }
  main { padding:32px 36px 16px; }
  h1 { font-size:54px; font-weight:800; margin:4px 0 12px; line-height:1.12; }
  h2 { font-size:28px; font-weight:800; margin:0 0 14px; }
  .eyebrow { font-size:30px; }
  .seed { font-size:24px; color:var(--ink-2); max-width:1100px; line-height:1.5; }
  .row { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
  .teams { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-top:24px; }
  .team { background:#fff; border:1px solid var(--line); border-top:4px solid var(--c); padding:14px 16px; }
  .team h3 { margin:0 0 8px; font-size:20px; display:flex; align-items:baseline; gap:8px; }
  .qr { background:#fff; padding:10px; display:inline-block; }
  .qr svg { display:block; width:250px; height:250px; }
  .bigcode { font-size:58px; font-weight:800; letter-spacing:10px; color:var(--navy); font-variant-numeric:tabular-nums; }
  .card.navy .bigcode { color:#fff; }
  .word { font-size:104px; font-weight:800; margin:6px 0 0; letter-spacing:-0.03em; }
  .ko { font-size:40px; color:var(--blue); font-weight:700; }
  .ex { font-size:34px; margin-top:22px; line-height:1.45; }
  .ex mark { background:linear-gradient(transparent 58%, var(--pink) 58%); color:inherit; text-decoration:none; }
  .settings { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:20px; color:var(--ink-2); font-size:17px; padding:14px 16px; background:#fff; border:1px solid var(--line); }
  .timer { font-size:84px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--navy); line-height:1; }
  .timer.low { color:var(--red); }
  .w { display:inline-block; padding:5px 11px; border:1px solid var(--line); background:var(--bar); margin:3px 4px 0 0; font-size:16px; }
  .w.done { background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700; }
  .story { background:var(--bar); border-left:3px solid var(--line-2); padding:8px 10px; margin-top:7px; font-size:15px; }
  .story.rep { border-left-color:var(--red); background:#fff; outline:1px solid var(--line); }
  .stage { position:relative; background:#000; overflow:hidden; width:100%; aspect-ratio:16/9; max-height:74vh; margin:0 auto; }
  .stage canvas { width:100%; height:100%; display:block; object-fit:contain; }
  .stage:fullscreen { max-height:none; }
  .floaty { position:absolute; bottom:6%; font-size:54px; pointer-events:none; animation:floaty 2.4s ease-out forwards; }
  @keyframes floaty { from { transform:translateY(0) scale(.6); opacity:0; } 15% { opacity:1; transform:translateY(-30px) scale(1.1); } to { transform:translateY(-360px) scale(1); opacity:0; } }
  .ctrl { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .ctrl button { font-size:18px; }
  .rx { font-size:30px; margin-right:16px; font-variant-numeric:tabular-nums; }
  .award { font-size:28px; margin:8px 0; padding:12px 0; border-bottom:1px solid var(--line); }
  .award b { color:var(--navy); }
  .foot { position:fixed; right:16px; bottom:16px; background:#fff; border:1px solid var(--line); padding:10px 14px; display:flex; gap:12px; align-items:center; z-index:4; box-shadow:0 6px 24px rgba(29,32,33,.12); }
  .foot .qr { padding:0; }
  .foot .qr svg { width:96px; height:96px; }
  .demobar { position:fixed; left:16px; bottom:16px; z-index:4; display:flex; gap:6px; flex-wrap:wrap; max-width:60vw; }
  .demobar button { font-size:14px; padding:8px 12px; background:#fff; border:1px dashed var(--red); color:var(--red); }
  .report { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0; margin-top:12px; border-top:2px solid var(--ink); }
  .report div { background:#fff; border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:14px 16px; font-size:15px; color:var(--dim); }
  .report b { display:block; font-size:26px; color:var(--navy); font-variant-numeric:tabular-nums; margin-top:4px; line-height:1.25; }
  .guide { background:var(--tint); border-left:4px solid var(--blue); padding:12px 16px; color:var(--ink); font-size:17px; margin:14px 0; line-height:1.6; }
  .credit { position:static; }
  label.inline { display:inline-flex; gap:6px; align-items:center; }
</style>
</head>
<body>
<header>
  <span class="brand">Relay Story Live</span>
  <button class="step" data-p="topic"><span class="n">01</span>오늘의 Topic</button>
  <button class="step" data-p="words"><span class="n">02</span>단어</button>
  <button class="step" data-p="write"><span class="n">03</span>릴레이 소설</button>
  <button class="step" data-p="video"><span class="n">04</span>AI 영상</button>
  <button class="step" data-p="watch"><span class="n">05</span>함께 보기</button>
  <span class="sp"></span>
  <span class="meta"><span id="mode" class="badge"></span><span id="count" class="dim"></span><span class="code" id="codeTop"></span></span>
</header>
<main id="main">불러오는 중…</main>
<div id="stageWrap" hidden style="padding:0 30px">
  <div class="stage" id="stage"><canvas id="screen"></canvas></div>
</div>
<div class="credit" id="credit"></div>
<div class="foot" id="foot" hidden><div class="qr" id="qrSmall"></div><div class="dim">늦게 온 학생<br>코드 <b id="footCode" style="color:var(--gold)"></b></div></div>
<div class="demobar" id="demoBar" hidden></div>
<div id="modal"></div>

<script src="js/config.js"></script>
<script>if (window.RSL_CONFIG.firebase && !new URLSearchParams(location.search).has("demo")) document.write('<script src="vendor/firebase-app-compat.js"><\/script><script src="vendor/firebase-auth-compat.js"><\/script><script src="vendor/firebase-database-compat.js"><\/script>');</script>
<script src="js/content.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/engine.js"></script>
<script src="js/pixelart.js"></script>
<script src="js/theater.js"></script>
<script src="js/bus.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ITEM_ICON = { bgm: "", voice_cast: "", bonus_scene: "" };
const EMO = { clap: "👏", laugh: "😂", wow: "😮", heart: "❤️" };
const DEMO = RSLBus.isDemo();
const store = RSLBus.store;
let E = null, link = null, V = null;
$("#credit").textContent = (window.RSL_CONFIG.credit || "");

/* ---------- 교사가 정하는 것 (이 컴퓨터에 저장) ---------- */
function loadList(k) { try { return JSON.parse(store.get(k) || "[]"); } catch (e) { return []; } }
const custom = () => loadList("rsl-custom-topics");
function content() {
  const C = JSON.parse(JSON.stringify(window.RSL_CONTENT));
  C.topics = C.topics.concat(custom().map((t) => Object.assign({ custom: true }, t)));
  return C;
}

/* ---------- 시작 ---------- */
async function boot() {
  const qs = RSLBus.params;
  let room = qs.get("r") || (DEMO ? null : store.get("rsl-host-room"));
  try {
    link = await RSLBus.host(room, onAction);
  } catch (e) { $("#main").innerHTML = `<div class="card"><h2>연결하지 못했어요</h2><p>${esc(RSLBus.explain(e))}</p><p class="dim">시연 모드는 <a href="demo.html">여기</a>에서 바로 열 수 있어요.</p></div>`; return; }
  room = link.room;
  if (!DEMO) store.set("rsl-host-room", room);
  const saved = await link.loadState();
  E = new RSLEngine(content(), saved, { room, realNames: loadList("rsl-real-names"), extraBanned: loadList("rsl-extra-banned"), onEvent });
  E.S.room = room;
  $("#mode").textContent = DEMO ? "시연 모드" : "수업 모드";
  $("#mode").className = "badge" + (DEMO ? " demo" : "");
  changed();
  setInterval(() => { if (E.tick()) changed(); updateTimer(); }, 1000);
  if (DEMO) demoBar();
}
function onAction(pid, type, body) {
  const res = E.playerAction(pid, type, body);
  changed();
  return res;
}
function act(b) { if (E.hostAction(b)) changed(); }
let pubTimer = null, renderPending = false;
function changed() {
  link.saveState(E.S);
  if (!pubTimer) pubTimer = setTimeout(publish, 120);
  if (!renderPending) { renderPending = true; requestAnimationFrame(() => { renderPending = false; render(); }); }
}
function publish() {
  pubTimer = null;
  const views = {};
  const off = link.offset || 0, sv = (v) => { if (v.write && v.write.endsAt) v.write.endsAt += off; return v; };
  for (const pid of Object.keys(E.S.players)) views[pid] = sv(E.playerView(pid));
  link.publish(sv(E.playerView(null)), views);
}
function joinUrl() {
  const base = location.href.replace(/host\.html.*$/, "");
  return DEMO ? `${base}play.html?demo=1&r=${E.S.room}` : `${base}play.html?r=${E.S.room}`;
}
function galleryUrl() { const base = location.href.replace(/host\.html.*$/, ""); return `${base}watch.html?r=${E.S.room}${DEMO ? "&demo=1" : ""}`; }
function qrSvg(text, cell) { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: cell || 6, margin: 2, scalable: true }); }
function onEvent(kind, data) {
  if (kind === "react" && V && V.phase === "watch") floatEmoji(EMO[data.emoji]);
}

/* ---------- 그리기 ---------- */
document.querySelectorAll(".step").forEach((b) => b.onclick = () => act({ action: "phase", phase: b.dataset.p }));
document.addEventListener("keydown", (e) => {
  if (!V || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (V.phase === "words" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) act({ action: "word", d: e.key === "ArrowRight" ? 1 : -1 });
  if (V.phase === "words" && e.key === " ") { e.preventDefault(); speakWord(V.topic.words[V.wordIndex].word); }
});
function speakWord(word, sentence) {
  const w = V.topic.words.find((x) => x.word === word);
  let spoke = false;
  const fallback = () => { if (spoke) return; spoke = true; try { const u = new SpeechSynthesisUtterance(sentence && w ? w.ex : word); u.lang = "en-US"; u.rate = 0.85; speechSynthesis.speak(u); } catch (e) {} };
  const a = new Audio(`assets/audio/${encodeURIComponent(word)}${sentence ? "_ex" : ""}.mp3`);
  a.onerror = fallback; a.play().catch(fallback);
}
let lastPhase = null;
function render() {
  if (!E) return;
  const a = document.activeElement;
  const typing = a && ((a.tagName === "INPUT" && a.type !== "checkbox") || a.tagName === "TEXTAREA" || a.tagName === "SELECT") && !a.closest("#modal");
  if (typing && V && V.phase === E.S.phase) { clearTimeout(render.retry); render.retry = setTimeout(changed, 800); return; }
  V = E.hostView();
  if (V.phase !== "watch" && $("#watchInfo")) $("#watchInfo").remove();
  document.querySelectorAll(".step").forEach((b) => b.classList.toggle("on", b.dataset.p === V.phase));
  $("#count").textContent = `참여 ${V.players.length}명`;
  $("#codeTop").textContent = V.room;
  $("#foot").hidden = V.phase === "topic" || V.phase === "watch";
  $("#qrSmall").innerHTML = qrSvg(joinUrl(), 3); $("#footCode").textContent = V.room;
  if (V.phase !== lastPhase && lastPhase === "watch") stopTheater();
  lastPhase = V.phase;
  $("#stageWrap").hidden = V.phase !== "watch" || V.watchIndex >= V.screen.length;
  ({ topic: rTopic, words: rWords, write: rWrite, video: rVideo, watch: rWatch })[V.phase]();
}

function rTopic() {
  const T = V.topic, url = joinUrl();
  $("#main").innerHTML = `
  <div class="row">
    <div style="flex:1;min-width:520px">
      <div class="eyebrow">Today's Topic</div>
      <h1 class="brk">${esc(T.title)}</h1>
      <div class="seed">${esc(T.seed)}</div>
      <div style="margin-top:14px;font-size:20px">등장인물: ${T.characters.map((c) => `<span class="chip">${esc(c)}</span>`).join("")} <span class="dim">+ 새 인물 자유</span></div>
      <div class="guide"><span class="tag blue">안내 멘트</span> "오늘은 이 주제로 모둠 친구들과 영어 이야기를 이어 쓰고, 마지막에 영상으로 다 같이 봐요. 화면의 QR을 찍거나 코드를 넣고 별명으로 들어오세요."</div>
      <div class="settings">
        주제 <select id="selTopic">${V.topics.map((t) => `<option value="${t.id}" ${t.id === T.id ? "selected" : ""}>${t.custom ? "★ " : ""}${esc(t.title)}</option>`).join("")}</select>
        <button id="btnNewTopic">＋ 주제 만들기</button>
      </div>
      <div class="settings">
        모둠 수 <select id="selTeams">${[2, 3, 4, 5, 6, 7, 8].map((n) => `<option ${n === V.teamCount ? "selected" : ""}>${n}</option>`).join("")}</select>
        돌려 쓰기 라운드 <select id="selRounds">${[2, 3, 4, 5, 6].map((n) => `<option ${n === V.write.rounds ? "selected" : ""}>${n}</option>`).join("")}</select>
        라운드 시간 <select id="selSec">${[120, 180, 240, 300].map((n) => `<option value="${n}" ${n === V.write.roundSec ? "selected" : ""}>${n / 60}분</option>`).join("")}</select>
        <button id="btnSafety">실명·금지어 설정</button>
        <button id="btnReset">새 수업 (처음부터)</button>
      </div>
      <div class="dim" style="margin-top:8px;font-size:15px">권장(45분): 모둠 6개(4~5명) · 라운드 4 · 3분 → 쓰기 약 13분</div>
    </div>
    <div class="card navy" style="text-align:center">
      <div class="qr">${qrSvg(url, 8)}</div>
      <div class="dim" style="margin-top:8px">참여 코드</div>
      <div class="bigcode">${esc(V.room)}</div>
      <div class="dim" style="font-size:14px;max-width:290px;word-break:break-all">${esc(url.replace(/^https?:\/\//, ""))}</div>
    </div>
  </div>
  <div class="teams">${V.teams.map((t) => `
    <div class="team" style="--c:${t.color}"><h3>${esc(t.name)} <span class="dim" style="font-size:15px;font-weight:500">${t.members.length}명</span></h3>
    ${V.players.filter((p) => p.team === t.id).map((p) => `<span class="chip" data-kick="${p.id}" title="눌러서 내보내기">${esc(p.name)}</span>`).join("") || '<span class="dim">아직 없음</span>'}</div>`).join("")}
  </div>`;
  $("#selTopic").onchange = (e) => { e.target.blur(); act({ action: "topic", topic: e.target.value }); };
  $("#selTeams").onchange = (e) => { e.target.blur(); act({ action: "teams", n: e.target.value }); };
  $("#selRounds").onchange = (e) => { e.target.blur(); act({ action: "rounds", n: e.target.value }); };
  $("#selSec").onchange = (e) => { e.target.blur(); act({ action: "roundSec", n: e.target.value }); };
  $("#btnReset").onclick = () => { if (confirm("참가자, 점수, 이야기를 모두 지우고 처음부터 시작할까요?")) act({ action: "reset" }); };
  $("#btnSafety").onclick = safetyModal;
  $("#btnNewTopic").onclick = topicModal;
  document.querySelectorAll("[data-kick]").forEach((c) => c.onclick = () => { if (confirm(`'${c.textContent}' 학생을 내보낼까요?`)) act({ action: "kick", pid: c.dataset.kick }); });
}

function rWords() {
  const W = V.topic.words, w = W[V.wordIndex];
  const ex = esc(w.ex).replace(new RegExp("\\b(" + w.word + "\\w*)", "i"), "<mark>$1</mark>");
  const teams = V.teams.filter((t) => t.members.length);
  const quizPart = V.quiz === "closed" ? `
      <button class="primary" id="qOpen" style="font-size:22px;padding:16px 22px">단어 퀴즈 시작 (${V.questions}문제)</button>
      <div class="dim" style="margin:10px 0">모둠 정답률이 높으면 영상 아이템을 얻어요</div>
      ${V.items.map((it) => `<div class="item">${ITEM_ICON[it.id]} ${esc(it.name)} · ${Math.round(it.min * 100)}% 이상</div>`).join("")}` : `
      <h2>${V.quiz === "open" ? "퀴즈 진행 중" : "영상 아이템 결과"}</h2>
      ${teams.map((t) => `<div style="margin:10px 0;--c:${t.color}">
        <div style="display:flex;justify-content:space-between"><b style="color:${t.color}">${esc(t.name)}</b><span>${t.quiz.acc}% <span class="dim">(${t.quiz.answered}개 답)</span></span></div>
        <div class="bar"><i style="width:${t.quiz.acc}%"></i>${V.items.map((it) => `<span class="tick" style="left:${it.min * 100}%"></span>`).join("")}</div>
        ${V.quiz === "results" ? V.items.map((it) => `<span class="item ${t.quiz.items.includes(it.id) ? "got" : ""}">${ITEM_ICON[it.id]} ${esc(it.name)}</span>`).join("") : ""}
      </div>`).join("") || '<div class="dim">아직 입장한 모둠이 없어요</div>'}
      ${V.quiz === "open" ? `<button class="primary" id="qRes">결과 보기 (퀴즈 마감)</button>` : `<button id="qAgain">퀴즈 다시 열기</button> <button class="primary" id="goWrite">3 릴레이 소설로 →</button>`}`;
  $("#main").innerHTML = `
  <div class="guide">단어 카드를 넘기며 🔊 버튼으로 발음을 들려주세요. 선생님은 영어를 읽지 않아도 돼요. 다 보면 오른쪽 퀴즈를 시작하세요.</div>
  <div class="row">
    <div class="card" style="flex:1.4;min-width:560px">
      <div class="dim" style="font-size:19px">WORD ${V.wordIndex + 1} / ${W.length} · 2022 기본 어휘(중학교) · ${esc(w.pos)}</div>
      <div class="word">${esc(w.word)}</div>
      <div class="ko">${esc(w.ko)}</div>
      <div class="ex">${ex}</div>
      <div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">
        <button id="prev" style="font-size:22px">◀</button><button id="say" style="font-size:20px">🔊 단어</button><button id="sayEx" style="font-size:20px">🔊 예문</button><button id="next" style="font-size:22px">▶</button>
        <span class="dim" style="align-self:center">← → 키로 넘기기 · 스페이스 = 발음</span>
      </div>
    </div>
    <div class="card" style="flex:1;min-width:380px">${quizPart}</div>
  </div>`;
  $("#prev").onclick = () => act({ action: "word", d: -1 });
  $("#next").onclick = () => act({ action: "word", d: 1 });
  $("#say").onclick = () => speakWord(w.word);
  $("#sayEx").onclick = () => speakWord(w.word, true);
  if ($("#qOpen")) $("#qOpen").onclick = () => act({ action: "quiz", state: "open" });
  if ($("#qRes")) $("#qRes").onclick = () => act({ action: "quiz", state: "results" });
  if ($("#qAgain")) $("#qAgain").onclick = () => act({ action: "quiz", state: "open" });
  if ($("#goWrite")) $("#goWrite").onclick = () => act({ action: "phase", phase: "write" });
}

function fmt(sec) { sec = Math.max(0, sec | 0); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }
function updateTimer() {
  const el = $("#timer"); if (!el || !E) return;
  const w = E.S.write;
  if (w.closingAt) { el.textContent = "저장 중…"; el.classList.add("low"); return; }
  const left = w.endsAt ? Math.round((w.endsAt - Date.now()) / 1000) : 0;
  el.textContent = fmt(left); el.classList.toggle("low", left <= 30);

const prepCache = {};
async function prepFilm(story) {
  const film = E.buildFilm(story), key = JSON.stringify(film);
  if (!prepCache[story.id] || prepCache[story.id].key !== key) prepCache[story.id] = { key, p: RSLTheater.prepare(film, { topicId: E.S.topicId }) };
  return prepCache[story.id].p;
}
let making = null, mkPct = 0;
async function makeFilms() {
  if (making) return making;
  const stories = E.S.stories.filter((s) => s.episodes.length);
  const prog = { done: 0, total: stories.length };
  making = (async () => {
    for (const s of stories) { await prepFilm(s); prog.done++; const el = $("#mkProg"); mkPct = Math.round((100 * prog.done) / prog.total); if (el) el.style.width = mkPct + "%"; await new Promise((r) => setTimeout(r, 60)); }
    link.publishFilms(E.allFilms());
    act({ action: "makeFilms" });
    making = null;
  })();
  return making;
}

function demoBar() {
  const bar = $("#demoBar"); bar.hidden = false;
  const bots = ["Tiger", "Cookie", "Rocket", "Mango", "Pixel", "Bubble", "Nova", "Panda", "Comet", "Kiwi", "Lemon", "Otter"];
  bar.innerHTML = `<button id="dJoin">가상 학생 8명 입장</button><button id="dQuiz">퀴즈 자동 풀기</button><button id="dWrite">이번 라운드 자동 쓰기</button><button id="dVote">대표작·투표 자동</button>`;
  $("#dJoin").onclick = () => { bots.slice(0, 8).forEach((n, i) => E.playerAction("bot" + i, "join", { name: n, team: i % Math.min(4, E.S.teams.length) })); changed(); };
  $("#dQuiz").onclick = () => {
    if (E.S.quiz !== "open") E.hostAction({ action: "quiz", state: "open" });
    const qs = E.questions();
    for (const p of Object.values(E.S.players)) if (p.id.startsWith("bot")) {
      const skill = 0.55 + (p.team % 3) * 0.17;
      for (const q of qs) if (!p.answers[q.id]) E.playerAction(p.id, "answer", { qid: q.id, choice: Math.random() < skill ? q.answer : q.options.find((o) => o !== q.answer) });
    }
    changed();
  };
  $("#dWrite").onclick = () => {
    if (E.S.phase !== "write") E.hostAction({ action: "phase", phase: "write" });
    const r = E.S.write.round;
    for (const pid of Object.keys(E.S.players)) {
      if (!pid.startsWith("bot")) continue;
      const s = E.heldStory(pid); if (!s || s.episodes.some((e) => e.k === r)) continue;
      const j = E.teamStories(s.team).indexOf(s), prev = s.episodes.filter((e) => e.k < r).pop();
      E.playerAction(pid, "submit", Object.assign(RSLEngine.sample(E.topic(), r, j, !!(prev && prev.next)), { round: r }));
    }
    changed();
  };
  $("#dVote").onclick = () => {
    for (const p of Object.values(E.S.players)) {
      if (!p.id.startsWith("bot")) continue;
      const mine = E.teamStories(p.team).filter((s) => s.episodes.length);
      if (mine.length && E.S.phase === "video") E.playerAction(p.id, "teamVote", { story: mine[Math.floor(Math.random() * mine.length)].id });
      if (E.S.phase === "watch") { const others = E.screenList().filter((x) => x.team.id !== p.team); if (others.length) E.playerAction(p.id, "vote", { team: others[Math.floor(Math.random() * others.length)].team.id }); const cur = E.screenList()[E.S.watchIndex]; if (cur) E.playerAction(p.id, "react", { team: cur.team.id, emoji: ["clap", "laugh", "wow", "heart"][Math.floor(Math.random() * 4)] }); }
    }
    changed();
  };
}
boot();
</script>
</body>
</html>
